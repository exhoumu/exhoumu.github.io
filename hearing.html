<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>商談ヒアリングシート｜育守法務事務所</title>
<style>
:root{--navy:#0D1B42;--cream:#F7F4EA;--paper:#FCFBF5;--line:#D9D2BF;--ink:#1E2A3A;--sub:#355269;--gold:#7A6230}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:16px;line-height:1.7}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top .ttl{font-weight:700;letter-spacing:.06em;margin-right:auto}
.top select{font:inherit;font-size:14px;padding:6px 8px;border-radius:4px;border:none;max-width:260px}
button{font:inherit;font-size:14.5px;padding:9px 14px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;cursor:pointer;min-height:42px}
.top button{border-color:#fff}
button.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px 80px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.tabs a{flex:none;text-decoration:none;color:var(--navy);border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px}
.tabs a .n{color:var(--gold);font-weight:700;margin-left:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0;scroll-margin-top:120px}
h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.lead{color:var(--sub);font-size:14px;margin:0 0 8px}
.q{border-top:1px solid #EEE8DA;padding:10px 0}
.q:first-of-type{border-top:none}
.q label{display:block;font-weight:700}
.q .hint{font-size:13px;color:var(--gold);margin:2px 0 4px}
.hidememo .hint,.hidememo .memoonly{display:none}
textarea,input[type=text],input[type=date],input[type=number],select.f{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid #B9C1CE;border-radius:6px;background:var(--paper)}
textarea{min-height:46px;resize:vertical;overflow:hidden}
.grid{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid #B9C1CE;border-radius:20px;padding:6px 12px;background:var(--paper);font-weight:400;font-size:14.5px}
.chips input{width:18px;height:18px}
.sw{display:flex;align-items:center;gap:6px;font-size:14px;color:#fff}
.sw input{width:20px;height:20px}
.note{font-size:13px;color:var(--sub)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:6px;display:none;z-index:9}
.saved{font-size:12px;color:#C9D2E3}
@media (max-width:640px){.grid{grid-template-columns:1fr}.top .ttl{width:100%}}
@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.tabs,.noprint{display:none!important}
  .card{border:none;padding:0;margin:0 0 10px;break-inside:auto}
  .q{break-inside:avoid;padding:5px 0}
  textarea,input,select.f{border:none;border-bottom:1px solid #bbb;border-radius:0;background:#fff;padding:2px 0;min-height:0}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="top">
  <span class="ttl">商談ヒアリングシート <span class="saved" id="saved"></span></span>
  <label class="sw"><input type="checkbox" id="hideMemo"> 支援メモを隠す（見せるとき）</label>
  <select id="recs" title="保存した商談"></select>
  <button id="bNew">新しく</button>
  <button id="bOut" class="pri">書き出す</button>
</div>
<div class="wrap" id="app"></div>
<div class="wrap noprint" style="padding-top:0">
  <div class="card">
    <h2>保存と書き出し</h2>
    <p class="lead">入力は、この端末の中に自動で残ります（どこにも送られません）。ただし、ブラウザの設定や掃除で消えることがあるので、聞き終わったら必ず書き出してください。</p>
    <div class="chips" style="gap:8px">
      <button id="bJson">ファイルに保存（あとで続きを書ける）</button>
      <button id="bLoad">保存したファイルを読み込む</button>
      <button id="bTxt">文章で保存（.txt）</button>
      <button id="bCopy">文章をコピー</button>
      <button id="bPrint">印刷・PDF</button>
      <button id="bDel">この商談を端末から消す</button>
    </div>
    <p class="note">書き出したファイルは C:\育守データ\見込み客\ に置きます（顧問契約になったら C:\育守データ\顧問先\&lt;コード&gt;\ へ）。従業員の名前は書かず、「Aさん（営業・50代）」のように書きます。</p>
    <input type="file" id="file" accept=".json,application/json" style="display:none">
  </div>
</div>
<div id="toast"></div>

<script>
const INTS=['職場診断レポート','離職コスト','給料の逆転','人件費・会社の数字','手続き・給与計算の手間','採用','就業規則・ルール','面談の仕組み','助成金','AI・デジタルの活用'];
const TEMPS=['','まだ情報集め','前向き','他と比べている','今は見送り'];
// [質問, つながる支援（代表メモ）]
const SEC=[
 {id:'s1',t:'1 会社のこと',lead:'会社の形と人の構成をつかみます。数字は「だいたい」で十分です。',q:[
  ['何をしている会社ですか。お客様はどんな方ですか','業種で国の統計と比べられるか（医療・福祉は対象外）'],
  ['創業はいつですか。法人ですか、個人ですか','創業間もない → 手続き・就業規則の立ち上げ'],
  ['働いている人は何人ですか（正社員・パート・役員）','パートが多い → キャリアアップ（正社員化）、短時間労働者の時間延長'],
  ['年齢の幅はどれくらいですか。60歳以上の方はいますか','60歳以上 → 65歳超継続雇用、エイジフレンドリー'],
  ['季節で忙しさや人数は変わりますか','冬に休む人がいる → 通年雇用'],
  ['事業所・現場はいくつありますか','拠点ごとの36協定・労災の成立'],
  ['今、手続きや給与計算は誰がしていますか','社長が自分で → 手続き・給与計算、FORROU'],
  ['就業規則はありますか。最後に直したのはいつですか','規程の整備・見直し（規程一覧に登録）'],
 ]},
 {id:'s2',t:'2 社長の考えとなりたい姿',lead:'困りごとより先に聞きます。提案が「社長の目指す形への一手」になります。',q:[
  ['この会社を始めた（継いだ）きっかけは何ですか','理念を就業規則・評価の軸にする'],
  ['大切にしていること、これだけは譲れないことは何ですか','同上'],
  ['3年後、会社はどうなっていたいですか（売上・人数・拠点）','採用計画、人件費の見通し（定期分析）'],
  ['どんな人に働いてほしいですか。今いる人のどこが良いですか','採用プロデュース顧問、育てるサービス'],
  ['社長が今、一番時間を取られていることは何ですか','手続き・給与計算の引き取り、デジタル化'],
  ['社長が継ぐ人・任せる人は決まっていますか','幹部の育成、組織づくり軍師'],
 ]},
 {id:'s3',t:'3 困っていること',lead:'「何か困っていますか」では出にくいので、具体的な場面で聞きます。',q:[
  ['この1年で辞めた人はいますか。入ってすぐ辞めた人は','組織づくり軍師、職場診断、初回診断（離職コスト）'],
  ['募集しても人が来ない、ということはありますか','採用プロデュース顧問'],
  ['求人サイトなどにかけている費用は、月いくらくらいですか','初回診断の「お金で見ると」（求人費）'],
  ['給与や評価について、従業員から何か言われたことはありますか','育てるサービス（評価・賃金制度）'],
  ['人件費を払いすぎていないか、気になることはありますか','経営の数字（労働分配率を国と比較）'],
  ['従業員同士や、お客様とのトラブルで困ったことはありますか','守るサービス（ハラスメント・カスハラ対策）'],
  ['残業代はどう計算していますか。固定残業代はありますか','未払い残業の確認、労働時間短縮'],
  ['有給は全員年5日取れていますか','年休管理簿の整備、計画的付与'],
  ['手続きや給与計算で、間に合わなかったこと・不安なことはありますか','手続き・給与計算、加入漏れの確認'],
 ]},
 {id:'s4',t:'4 働き方と安全',lead:'労災の話は、助成金と保険の両方につながります。保険は紹介だけで、その場では勧めません。',q:[
  ['これまでに仕事中・通勤中のけがはありましたか。そのときどう対応しましたか','労災サポートパック、労災手続き'],
  ['転ぶ・腰を痛めるなど、よくあるけがはありますか','60歳以上がいる → エイジフレンドリー補助金（設備・対策）'],
  ['大きなけがのとき、会社としての備えはありますか（上乗せの保険など）','労災上乗せ保険・使用者賠償責任保険（TAC、紹介のみ）'],
  ['社長や役員も現場に出ますか','労災の特別加入（事務組合が必要）'],
  ['定年は何歳ですか。定年後も働いている人はいますか','65歳超継続雇用、無期転換'],
  ['育児休業を取った人、これから取りそうな人はいますか','両立支援（育児）、育介規程'],
  ['家族の介護をしている人はいますか','両立支援（介護）'],
  ['深夜や週末の勤務、連続した勤務はありますか','勤務間インターバル、労働時間短縮'],
 ]},
 {id:'s5',t:'5 これからの予定',lead:'助成金の多くは「始める前」に計画の届出が必要です。予定を先に聞くと、取り逃しを防げます。',q:[
  ['1年以内に人を採用する予定はありますか','採用プロデュース顧問、雇入れの助成金'],
  ['パートや契約社員を正社員にしたい人はいますか','キャリアアップ（正社員化）― 転換前に計画届が必要'],
  ['機械や設備、ソフトを入れる予定はありますか','業務改善（賃上げとセット）、働き方改革推進支援（時間短縮）'],
  ['賃上げの予定はありますか。最低賃金の改定で困る人はいますか','業務改善、最低賃金の確認'],
  ['定年や再雇用のルールを変える予定はありますか','65歳超継続雇用（定年引上げ等）'],
  ['AIやITのツールを仕事で使っていますか。これから使いたいですか','AI・デジタル活用支援/研修、情報管理規程'],
  ['情報漏えいやウイルスの備えはどうしていますか','AI導入研修とあわせてサイバー保険（TAC関与先向け、紹介のみ）'],
  ['新しい事業や拠点をつくる予定はありますか','就業規則の見直し、拠点ごとの手続き'],
 ]},
 {id:'s6',t:'6 決め方',lead:'最後に「どう決めるか」を聞いて、無理のない次の一手を決めます。',q:[
  ['社労士に頼むかどうかは、どなたが決めますか',''],
  ['月々の費用は、どれくらいを考えていますか',''],
  ['ほかに話を聞いている事務所はありますか',''],
  ['いつ頃から始めたいですか',''],
  ['今日の話で、一番気になったことは何ですか',''],
 ]},
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const LS='ikusu-hearing';
let DB={recs:{},cur:null};
try{DB=JSON.parse(localStorage.getItem(LS))||DB}catch(e){}
function blank(){return {id:'h'+Date.now(),v:1,head:{date:today(),co:'',who:'',ind:'',staff:'',where:''},a:{},ints:[],intm:'',now:'',temp:'',next:'',nextAt:'',free:''}}
if(!DB.cur||!DB.recs[DB.cur]){const r=blank();DB.recs[r.id]=r;DB.cur=r.id}
let R=DB.recs[DB.cur];
let tSave=null;
function persist(){R.updatedAt=new Date().toISOString();DB.recs[R.id]=R;try{localStorage.setItem(LS,JSON.stringify(DB));$('saved').textContent='端末に保存 '+new Date().toTimeString().slice(0,5)}catch(e){$('saved').textContent='端末に保存できません。書き出してください'}}
function save(){clearTimeout(tSave);tSave=setTimeout(persist,400)}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}

function render(){
  const H=R.head;let h=`<div class="tabs noprint">${SEC.map(s=>`<a href="#${s.id}">${s.t}<span class="n">${SEC_COUNT(s)}</span></a>`).join('')}<a href="#after">聞き終わったら</a></div>
<div class="card" id="s0"><h2>会社と面談の情報</h2><div class="grid">
<label>日付</label><input type="date" data-h="date" value="${esc(H.date)}">
<label>会社名</label><input type="text" data-h="co" value="${esc(H.co)}" placeholder="株式会社〇〇">
<label>お会いした方</label><input type="text" data-h="who" value="${esc(H.who)}" placeholder="代表取締役 〇〇様">
<label>業種</label><input type="text" data-h="ind" value="${esc(H.ind)}">
<label>人数</label><input type="text" data-h="staff" value="${esc(H.staff)}" placeholder="正社員〇人・パート〇人・役員〇人">
<label>会った場所・紹介者</label><input type="text" data-h="where" value="${esc(H.where)}">
</div></div>`;
  SEC.forEach(s=>{
    h+=`<div class="card" id="${s.id}"><h2>${s.t}</h2><p class="lead">${s.lead}</p>`;
    s.q.forEach((q,i)=>{const k=s.id+'_'+i;h+=`<div class="q"><label for="${k}">${esc(q[0])}</label>${q[1]?`<div class="hint">→ ${esc(q[1])}</div>`:''}<textarea id="${k}" data-a="${k}" rows="1" placeholder="社長の言葉のまま">${esc(R.a[k]||'')}</textarea></div>`});
    h+=`<div class="q"><label>そのほかメモ</label><textarea data-a="${s.id}_m" rows="1">${esc(R.a[s.id+'_m']||'')}</textarea></div></div>`;
  });
  h+=`<div class="card" id="after"><h2>聞き終わったら（名刺・提案シートの「商談の手がかり」へ）</h2>
<p class="lead">業務管理ソフトの「名刺・提案シート」と同じ項目です。書き出した文章をそのまま見ながら入れられます。</p>
<div class="q"><label>いま困っていること（社長の言葉のまま、一言で）</label><textarea data-k="now" rows="1">${esc(R.now)}</textarea></div>
<div class="q"><label>興味を示した話</label><div class="chips">${INTS.map(t=>`<label><input type="checkbox" data-int="${esc(t)}" ${R.ints.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div>
<textarea data-k="intm" rows="1" placeholder="反応のメモ（どこで身を乗り出したか など）" style="margin-top:6px">${esc(R.intm)}</textarea></div>
<div class="q"><label>温度感</label><select class="f" data-k="temp">${TEMPS.map(t=>`<option ${R.temp===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
<div class="q memoonly"><label>つながりそうな支援（1〜3個にしぼる・代表メモ）</label><textarea data-k="free" rows="1">${esc(R.free)}</textarea></div>
<div class="q"><label>次の一手</label><textarea data-k="next" rows="1" placeholder="例：初回診断のデータをお願いする／見積書を送る">${esc(R.next)}</textarea>
<div class="grid" style="margin-top:6px"><label>次の一手の日付</label><input type="date" data-k="nextAt" value="${esc(R.nextAt)}"></div></div>
<p class="note">その日のうちに：①名刺・提案シートに入れる ②次の一手と日付を入れる（タスクに出ます） ③助成金は最新の要件を確かめてから「使えるかもしれない」と伝える ④お礼と次の約束はChatwork（契約前はメール・LINE）で。</p></div>`;
  $('app').innerHTML=h;
  document.querySelectorAll('textarea').forEach(grow);
  renderRecs();
}
const SEC_COUNT=s=>{const n=s.q.filter((q,i)=>(R.a[s.id+'_'+i]||'').trim()).length;return n?n+'/'+s.q.length:''};
function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}
function renderRecs(){
  const list=Object.values(DB.recs).sort((a,b)=>(b.head.date||'').localeCompare(a.head.date||''));
  $('recs').innerHTML=list.map(r=>`<option value="${r.id}" ${r.id===R.id?'selected':''}>${esc(r.head.date)} ${esc(r.head.co||'（会社名なし）')}</option>`).join('');
}
function refreshTabs(){document.querySelectorAll('.tabs a').forEach((a,i)=>{const s=SEC[i];if(s)a.querySelector('.n').textContent=SEC_COUNT(s)})}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.h){R.head[t.dataset.h]=t.value;if(t.dataset.h==='co'||t.dataset.h==='date')renderRecs()}
  else if(t.dataset.a){R.a[t.dataset.a]=t.value;grow(t);refreshTabs()}
  else if(t.dataset.k){R[t.dataset.k]=t.value;if(t.tagName==='TEXTAREA')grow(t)}
  else if(t.dataset.int!=null){const v=t.dataset.int;R.ints=R.ints.filter(x=>x!==v);if(t.checked)R.ints.push(v)}
  else return;
  save();
});
$('hideMemo').onchange=e=>document.body.classList.toggle('hidememo',e.target.checked);
$('recs').onchange=e=>{persist();DB.cur=e.target.value;R=DB.recs[DB.cur];persist();render();scrollTo(0,0)};
$('bNew').onclick=()=>{persist();const r=blank();DB.recs[r.id]=r;DB.cur=r.id;R=r;persist();render();scrollTo(0,0);toast('新しいシートを作りました')};
$('bDel').onclick=()=>{if(!confirm('この商談の入力を、この端末から消します。書き出しは済んでいますか？'))return;delete DB.recs[R.id];const ids=Object.keys(DB.recs);if(ids.length){DB.cur=ids[0];R=DB.recs[DB.cur]}else{R=blank();DB.recs[R.id]=R;DB.cur=R.id}persist();render()};
function fname(ext){return `商談_${(R.head.date||today())}_${(R.head.co||'会社名なし').replace(/[\\/:*?"<>|\s]/g,'')}.${ext}`}
function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function asText(){
  const H=R.head;const L=[];
  L.push(`商談ヒアリング｜${H.co||''}`,`日付：${H.date}　お会いした方：${H.who}`,`業種：${H.ind}　人数：${H.staff}`,`会った場所・紹介者：${H.where}`,'');
  SEC.forEach(s=>{const rows=s.q.map((q,i)=>[q,R.a[s.id+'_'+i]]).filter(x=>(x[1]||'').trim());const m=R.a[s.id+'_m'];if(!rows.length&&!m)return;L.push(`■${s.t}`);rows.forEach(([q,a])=>{L.push(`・${q[0]}`,`　${a.trim().replace(/\n/g,'\n　')}`);if(q[1])L.push(`　（つながる支援：${q[1]}）`)});if(m)L.push(`・メモ：${m}`);L.push('')});
  L.push('■商談の手がかり（名刺・提案シートへ）',`いま困っていること：${R.now}`,`興味を示した話：${R.ints.join('、')}`,`反応のメモ：${R.intm}`,`温度感：${R.temp}`,`つながりそうな支援：${R.free}`,`次の一手：${R.next}（${R.nextAt}）`);
  return L.join('\n');
}
$('bJson').onclick=()=>{persist();dl(fname('json'),JSON.stringify(R,null,1),'application/json');toast('ダウンロードに保存しました')};
$('bTxt').onclick=()=>{dl(fname('txt'),asText(),'text/plain');toast('ダウンロードに保存しました')};
$('bOut').onclick=()=>{persist();dl(fname('json'),JSON.stringify(R,null,1),'application/json');setTimeout(()=>dl(fname('txt'),asText(),'text/plain'),400);toast('ファイルと文章を保存しました')};
$('bCopy').onclick=()=>{const t=asText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('コピーしました'),()=>prompt('コピーしてお使いください',t))};
$('bPrint').onclick=()=>window.print();
$('bLoad').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.head||!o.a)throw 0;o.id=o.id||('h'+Date.now());DB.recs[o.id]=o;DB.cur=o.id;R=o;persist();render();toast('読み込みました')}catch(x){alert('ヒアリングシートのファイルではないようです')}};r.readAsText(f);e.target.value=''};
window.addEventListener('beforeunload',persist);
render();persist();
</script>
</body>
</html>
